<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chalice · match setup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
  :root{
    --ink:#f6e9cf;
    --cream:#f1e2b8;
    --dim:#8d8371;
    --gold:#e8b84a;
    --hot:#ffd479;
    --line:rgba(232,184,74,.16);
    --soft:rgba(232,184,74,.07);
    --thistle:#a98cff;
    --marigold:#ff7048;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;color:var(--ink);
    font-family:'Barlow Condensed',system-ui,sans-serif;
    background:radial-gradient(ellipse at 58% 46%,#161226 0%,#0a0714 42%,#05040a 78%);
    user-select:none;
  }

  /* the cup sits behind everything */
  #cupWrap{position:fixed;inset:0;z-index:0;pointer-events:none}
  #cup{position:absolute;inset:0;width:100%;height:100%;display:block;filter:saturate(.9)}
  #cupGlow{position:absolute;left:54%;top:50%;width:min(980px,70vw);height:min(980px,70vw);transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(232,184,74,.13),rgba(122,92,255,.06) 45%,transparent 68%);filter:blur(10px)}
  #scrim{position:fixed;inset:0;z-index:1;pointer-events:none;background:
    linear-gradient(90deg,rgba(5,4,10,.93) 0%,rgba(5,4,10,.74) 30%,rgba(5,4,10,.18) 52%,rgba(5,4,10,.6) 78%,rgba(5,4,10,.94) 100%),
    linear-gradient(0deg,rgba(5,4,10,.92) 0%,rgba(5,4,10,.2) 26%,transparent 46%),
    linear-gradient(180deg,rgba(5,4,10,.72) 0%,transparent 20%)}
  #vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 52% 44%,transparent 34%,rgba(2,1,6,.66) 100%)}

  /* back + mockup tag */
  #back{all:unset;box-sizing:border-box;position:fixed;left:28px;top:22px;z-index:20;display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    padding:9px 16px;border:1px solid var(--line);color:#c9b893;background:rgba(5,4,10,.5);
    font-family:'Cinzel',Georgia,serif;font-size:10px;letter-spacing:.18em}
  #back:hover{color:#ffe9b4;border-color:rgba(232,184,74,.48)}
  #back .ar{font-size:14px;line-height:1}
  #mockTag{position:fixed;right:26px;top:26px;z-index:20;font-family:'Barlow Condensed';font-size:8px;font-weight:700;letter-spacing:.22em;color:#5c5548;border:1px solid rgba(232,184,74,.14);padding:4px 7px}

  main{position:relative;z-index:2;height:100%;padding:74px 48px 54px;overflow:hidden}
  .screen{display:none;height:100%;max-width:1720px;margin:0 auto}
  .screen.on{display:block}

  /* ---------- setup ---------- */
  .setupGrid{display:grid;grid-template-columns:minmax(0,540px) minmax(260px,1fr) minmax(340px,430px);gap:20px;align-items:start;height:100%}
  .setupLeft{display:flex;flex-direction:column;min-width:0;padding-top:2px;height:100%}
  .kick{font-family:'Barlow Condensed';font-size:9.5px;font-weight:600;letter-spacing:.36em;color:var(--gold);text-transform:uppercase}
  h1{margin:8px 0 0;font-family:'Cinzel',Georgia,serif;font-weight:500;font-size:clamp(40px,3.7vw,62px);letter-spacing:.1em;color:#f3e6c9;line-height:1.02}
  .meta{margin:20px 0 24px;display:flex;flex-direction:column;gap:8px}
  .meta div{display:flex;align-items:baseline;gap:16px;font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
  .meta span{min-width:58px;color:#7d7363}
  .meta b{font-weight:600;letter-spacing:.12em;color:#d8c9a8}

  .actions{display:flex;flex-direction:column;width:100%}
  .act{all:unset;box-sizing:border-box;position:relative;display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:64px;padding:0 20px 0 18px;cursor:pointer;border-bottom:1px solid var(--soft);font-family:'Cinzel',Georgia,serif;font-size:18px;font-weight:500;letter-spacing:.18em;color:#b9a97f;transition:color .12s}
  .act:first-child{border-top:1px solid var(--soft)}
  .act::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;background:transparent}
  .act .val{font-family:'Barlow Condensed';font-size:11px;font-weight:600;letter-spacing:.2em;color:#8d8371}
  .act .chev{display:inline-block;width:6px;height:6px;border-right:1.5px solid currentColor;border-top:1.5px solid currentColor;transform:rotate(45deg);opacity:.5;margin-left:8px}
  .act:hover{color:#e3d3ae}
  .act.focus{color:#f6e9cf}
  .act.focus::before{background:var(--gold);box-shadow:0 0 14px rgba(232,184,74,.6)}
  .act.focus .val{color:#e8c78a}
  .act.primary{min-height:76px;margin-top:18px;color:#241606;background:linear-gradient(90deg,#f6d98a,#e8b84a 55%,#c99532);font-weight:600;border-bottom:0;clip-path:polygon(0 0,100% 0,98.5% 100%,0 100%)}
  .act.primary::before{display:none}
  .act.primary:hover,.act.primary.focus{color:#1d1104;filter:brightness(1.08);box-shadow:0 0 26px rgba(232,184,74,.22)}
  .act.primary .chev{opacity:.8}

  /* map plate under the rows */
  .plate{position:relative;width:100%;height:210px;margin-top:24px;overflow:hidden;border:1px solid var(--line);background:#0b0912}
  .plate img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9) brightness(.78)}
  .plate::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,4,10,.9) 0%,rgba(5,4,10,.12) 42%,transparent 70%),linear-gradient(90deg,rgba(5,4,10,.5),transparent 40%)}
  .plate .nm{position:absolute;left:18px;bottom:14px;z-index:2;font-family:'Cinzel',Georgia,serif;font-size:24px;letter-spacing:.24em;color:#f3e6c9;text-shadow:0 2px 10px #000}
  .plate .tag{position:absolute;right:12px;top:11px;z-index:2;font-size:7.5px;font-weight:700;letter-spacing:.2em;color:#241606;background:var(--gold);padding:3px 6px}
  .plateCap{margin-top:11px;width:100%;font-size:10.5px;font-weight:600;letter-spacing:.2em;color:#a99a7c;text-transform:uppercase}
  .plateCap b{color:#e8c78a;font-weight:600}

  .loadTrack{width:100%;height:4px;margin-top:14px;background:rgba(232,184,74,.11);overflow:hidden;position:relative}
  .loadTrack::after{content:"";position:absolute;top:0;bottom:0;width:34%;left:-38%;background:linear-gradient(90deg,transparent,#e8b84a 40%,#ffe6a8 60%,transparent);animation:loadSweep 1.9s cubic-bezier(.5,0,.5,1) infinite}
  @keyframes loadSweep{to{left:104%}}

  .status{margin-top:12px;font-size:8.5px;font-weight:600;letter-spacing:.28em;color:#5c5548;text-transform:uppercase}

  .setupRight{grid-column:3;display:flex;flex-direction:column;gap:16px;padding-top:2px;min-width:0}
  .count{font-size:10.5px;font-weight:700;letter-spacing:.2em;color:#8d8371;text-transform:uppercase;text-align:right}
  .count span{color:#5c5548}
  .team{border:1px solid var(--soft);background:rgba(8,6,14,.5);padding:13px 15px 14px;position:relative}
  .team::before{content:"";position:absolute;left:0;right:0;top:0;height:2px}
  .team.thistle{border-left:2px solid var(--thistle);background:linear-gradient(90deg,rgba(169,140,255,.11),rgba(8,6,14,.5) 74%)}
  .team.marigold{border-left:2px solid var(--marigold);background:linear-gradient(90deg,rgba(255,112,72,.11),rgba(8,6,14,.5) 74%)}
  .team.thistle::before{background:linear-gradient(90deg,var(--thistle),transparent 60%)}
  .team.marigold::before{background:linear-gradient(90deg,var(--marigold),transparent 60%)}
  .team header{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.24em;margin-bottom:8px}
  .team.thistle header{color:var(--thistle)}
  .team.marigold header{color:var(--marigold)}
  .team header span{font-size:7.5px;letter-spacing:.16em;color:#7d7363}
  .trow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:11px;align-items:center;padding:8px 0;border-top:1px solid rgba(232,184,74,.06)}
  .trow .crest{width:28px;height:32px;display:flex;align-items:center;justify-content:center;color:#8d7a4e}
  .trow .crest svg{width:100%;height:100%}
  .trow .nm{font-size:13px;font-weight:600;letter-spacing:.1em;color:#d8c9a8;line-height:1.15}
  .trow .nm small{display:block;font-size:8.5px;font-weight:600;letter-spacing:.14em;color:#7d7363;margin-top:2px}
  .trow .tag{font-size:8px;font-weight:700;letter-spacing:.14em;color:#5c5548}
  .trow.you .nm{color:#ffe9b4}
  .trow.you .nm small{color:#c99b4a}
  .trow.you .tag{color:var(--gold)}
  .teamFoot{font-size:8px;font-weight:600;letter-spacing:.14em;color:#5c5548;margin-top:6px}

  /* ---------- sub pages ---------- */
  .subHead{text-align:center;padding:8px 0 20px}
  .subHead h1{font-size:clamp(30px,3vw,44px)}
  .subHead .sub{margin-top:8px;font-size:10px;font-weight:600;letter-spacing:.16em;color:#7d7363;text-transform:uppercase}

  /* map */
  .mapGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:44px;max-width:1420px;margin:0 auto;align-items:start}
  .mapList{display:flex;flex-direction:column}
  .mapRow{all:unset;box-sizing:border-box;position:relative;display:grid;grid-template-columns:180px minmax(0,1fr) auto;gap:18px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--soft);cursor:pointer}
  .mapRow:first-child{border-top:1px solid var(--soft)}
  .mapRow::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;background:transparent}
  .mapRow .art{width:180px;height:96px;display:block;position:relative;overflow:hidden;border:1px solid rgba(232,184,74,.12);background:#0b0912}
  .mapRow .art img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.85) brightness(.7)}
  .mapRow .nm{font-family:'Cinzel',Georgia,serif;font-size:18px;letter-spacing:.14em;color:#d8c9a8}
  .mapRow .ln{display:block;margin-top:4px;font-size:10.5px;font-weight:600;letter-spacing:.06em;color:#7d7363}
  .mapRow .tick{font-size:8px;font-weight:700;letter-spacing:.12em;color:var(--gold)}
  .mapRow.focus{color:#f6e9cf}
  .mapRow.focus::before{background:var(--gold);box-shadow:0 0 12px rgba(232,184,74,.6)}
  .mapRow.focus .nm{color:#f6e9cf}
  .mapRow.on .nm{color:#ffe9b4}
  .mapRow.off{opacity:.38;cursor:default}
  .mapPreview{border:1px solid var(--soft);background:rgba(8,6,14,.5);padding:12px}
  .mapPreview .big{height:390px;position:relative;overflow:hidden;background:#0b0912}
  .mapPreview .big img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9) brightness(.85)}
  .mapPreview .big::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,4,10,.7),transparent 55%)}
  .mapPreview .nm{font-family:'Cinzel',Georgia,serif;font-size:22px;letter-spacing:.16em;color:#f3e6c9;margin-top:12px}
  .mapPreview .ln{font-size:11.5px;font-weight:600;letter-spacing:.08em;color:#8d8371;margin-top:5px;line-height:1.5}

  /* options */
  .optWrap{width:min(1040px,100%);margin:0 auto}
  .optGroup{font-size:8.5px;font-weight:700;letter-spacing:.3em;color:#8d7a4e;text-transform:uppercase;margin:16px 0 4px;padding-left:3px}
  .optRows{display:flex;flex-direction:column}
  .optRow{all:unset;box-sizing:border-box;position:relative;display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:62px;padding:0 18px;border-bottom:1px solid var(--soft);cursor:pointer;font-family:'Cinzel',Georgia,serif;font-size:17px;letter-spacing:.14em;color:#b9a97f}
  .optRows > .optRow:first-child{border-top:1px solid var(--soft)}
  .optRow::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;background:transparent}
  .optRow .val{display:flex;align-items:center;gap:10px;font-family:'Barlow Condensed';font-size:14.5px;font-weight:600;letter-spacing:.14em;color:#c9a96a}
  .optRow .val i{font-style:normal;opacity:.35;font-size:15px;letter-spacing:0}
  .optRow.focus{color:#f6e9cf}
  .optRow.focus::before{background:var(--gold);box-shadow:0 0 13px rgba(232,184,74,.6)}
  .optRow.focus .val i{opacity:1;color:var(--gold)}
  .optRow .chev{display:inline-block;width:6px;height:6px;border-right:1.5px solid currentColor;border-top:1.5px solid currentColor;transform:rotate(45deg);opacity:.5;margin-left:6px}
  .optRow.open .chev{transform:rotate(-135deg);margin-top:3px}
  .botSub{margin-left:16px;border-left:1px solid rgba(232,184,74,.16);padding-left:8px}
  .botSub .optRow{min-height:54px;font-size:14.5px;color:#a99a7c}
  .botSub .optRow:first-child{border-top:0}
  .optRow.done{margin-top:18px;min-height:58px;color:#c99b4a}
  .optRow.done.focus{color:var(--hot)}
  .hintLine{text-align:center;margin-top:16px;font-size:9px;font-weight:600;letter-spacing:.18em;color:#5c5548;text-transform:uppercase}

  /* bottom hint */
  #hint{position:fixed;left:0;right:0;bottom:18px;z-index:20;display:flex;justify-content:center;gap:24px;font-size:10px;font-weight:600;letter-spacing:.18em;color:#6f6659;pointer-events:none}
  #hint .k{display:inline-flex;align-items:center;gap:7px}
  #hint .g{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;border:1px solid rgba(232,184,74,.3);border-radius:50%;color:var(--gold);font-size:9px;font-weight:700;letter-spacing:0;padding:0 4px}
  #toast{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);z-index:40;padding:8px 16px;border:1px solid var(--line);background:rgba(8,6,14,.92);font-size:11px;letter-spacing:.1em;color:#cbbfa4;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
  #toast.on{opacity:1}

  @media (max-width:1500px){
    .setupGrid{grid-template-columns:minmax(0,500px) minmax(220px,1fr) 390px;gap:18px}
    h1{font-size:clamp(36px,3.4vw,54px)}
    .plate{height:190px}
    .trow{padding:6px 0}
    .team{padding:11px 13px 12px}
  }
  @media (max-width:1340px){
    .setupGrid{grid-template-columns:minmax(0,430px) minmax(210px,1fr) 350px;gap:16px}
    .plate{height:170px}
  }
  @media (max-width:1150px){
    .setupGrid{grid-template-columns:1fr;gap:24px}
    .setupRight{grid-column:auto;flex-direction:row;flex-wrap:wrap}
    .count{width:100%;text-align:left}
    .team{flex:1;min-width:250px}
    .mapGrid{grid-template-columns:1fr}
    .mapPreview{display:none}
    .plate{height:150px}
  }
  @media (max-height:800px){
    main{padding-top:66px;padding-bottom:42px}
    h1{font-size:42px}
    .act{min-height:56px}
    .act.primary{min-height:64px;margin-top:12px}
    .meta{margin:12px 0 16px;gap:5px}
    .plate{height:156px;margin-top:16px}
    .plateCap{margin-top:8px}
    .loadTrack{margin-top:10px}
    .status{display:none}
    .trow{padding:5px 0}
    .team{padding:9px 12px 10px}
    .team header{margin-bottom:5px}
  }
  @media (max-width:760px){
    main{padding:70px 20px 40px}
    #back{left:16px}
    .act{font-size:14px}
    .meta div{font-size:9px}
    .plate{height:100px}
  }
</style>
</head>
<body>
<div id="cupGlow"></div>
<div id="cupWrap"><canvas id="cup"></canvas></div>
<div id="scrim"></div>
<div id="vignette"></div>

<button id="back" type="button"><span class="ar">‹</span> BACK</button>
<div id="mockTag">MOCKUP</div>

<main>
  <!-- ============ MATCH SETUP ============ -->
  <section id="setup" class="screen on">
    <div class="setupGrid">
      <div class="setupLeft">
        <div class="kick">LOCAL GAME</div>
        <h1>MATCH SETUP</h1>
        <div class="meta" id="setupMeta"></div>
        <nav class="actions" id="setupActions">
          <button type="button" class="act" data-go="map"><span>MAP</span><span class="val" id="mapValue">MAUSOLEUM</span></button>
          <button type="button" class="act" data-go="options"><span>EDIT GAME OPTIONS</span><span class="chev"></span></button>
        </nav>

        <div class="plate" id="plate">
          <img id="plateImg" alt="">
          <span class="nm" id="plateName">MAUSOLEUM</span>
          <span class="tag">CHALICE</span>
        </div>
        <div class="plateCap" id="plateCap">CHALICE ON MAUSOLEUM · FIRST TO 30 · 10 MIN</div>
        <div class="loadTrack"></div>
        <button type="button" class="act primary" data-go="classes">START GAME <span class="chev"></span></button>
      </div>
      <aside class="setupRight">
        <div class="count" id="playerCount">1 PLAYER + 5 BOTS <span>[6 MAX]</span></div>
        <div class="team thistle" id="teamThistle"></div>
        <div class="team marigold" id="teamMarigold"></div>
      </aside>
    </div>
  </section>

  <!-- ============ MAP ============ -->
  <section id="map" class="screen">
    <div class="subHead"><span class="kick">MATCH SETUP</span><h1>MAP</h1><div class="sub">Choose the field</div></div>
    <div class="mapGrid">
      <div class="mapList" id="mapList"></div>
      <div class="mapPreview" id="mapPreview"></div>
    </div>
  </section>

  <!-- ============ OPTIONS ============ -->
  <section id="options" class="screen">
    <div class="subHead"><span class="kick">MATCH SETUP</span><h1>OPTIONS</h1><div class="sub">Changes apply to the next match</div></div>
    <div class="optWrap">
      <div class="optGroup">MATCH</div>
      <div class="optRows" id="matchOpts"></div>
      <div class="optGroup">BOTS</div>
      <div class="optRows" id="botOpts"></div>
      <div class="optRows" id="doneRow"></div>
    </div>
  </section>
</main>

<footer id="hint">
  <span class="k"><span class="g">A</span> SELECT</span>
  <span class="k"><span class="g">B</span> BACK</span>
</footer>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

const CLASSES = [
  { key:'Arcanist', role:'CONTROLLER', hp:120, colour:'#9a7bff' },
  { key:'Crusader', role:'GUARDIAN', hp:145, colour:'#e0b45a' },
  { key:'Lampist', role:'HEALER', hp:120, colour:'#ffc06a' },
  { key:'Skulker', role:'ROGUE', hp:100, colour:'#6fd08a' },
  { key:'Zealot', role:'VANGUARD', hp:135, colour:'#d9744a' }
];
const BY_KEY = Object.fromEntries(CLASSES.map(c => [c.key, c]));

const MAPS = [
  { key:'Mausoleum', line:'Tight crypts around a central well.', art:'mock-assets/map-mausoleum.webp', on:true },
  { key:'Cathedral', line:'Long aisles, high galleries, a bell.', art:'mock-assets/map-cathedral.webp', on:true },
  { key:'Basilica', line:'A ringed nave under a broken dome.', art:'mock-assets/map-basilica.webp', on:false },
  { key:'Scrollwork', line:'Terraces and bridges over a dark drop.', art:'mock-assets/map-scrollwork.webp', on:false }
];
const MAP_BY_KEY = Object.fromEntries(MAPS.map(m => [m.key, m]));

const THISTLE_BOTS = [
  { name:'Wren', cls:'Lampist' }, { name:'Ash', cls:'Arcanist' },
  { name:'Gale', cls:'Skulker' }, { name:'Iris', cls:'Zealot' }
];
const MARIGOLD_BOTS = [
  { name:'Vex', cls:'Zealot' }, { name:'Moth', cls:'Skulker' },
  { name:'Bram', cls:'Crusader' }, { name:'Hilda', cls:'Lampist' }
];

const state = {
  screen:'setup',
  map:'Mausoleum',
  firstTo:30,
  len:10,
  size:3,
  bots:true,
  diff:'Normal',
  dupes:false,
  custom:false,
  cls:'Crusader',
  focus:{ setup:0, map:0, options:0 },
  starting:false
};

const $ = id => document.getElementById(id);
const crest = c => `<svg viewBox="0 0 24 28" fill="none" stroke="${c}" stroke-width="1.3" stroke-linejoin="round"><path d="M12 2l9 3v8.5c0 6-4 10.5-9 12.5-5-2-9-6.5-9-12.5V5z"/><path d="M12 8.5l3.6 6-3.6 6-3.6-6z" fill="${c}" stroke="none" opacity=".75"/></svg>`;

function teammates(){
  return THISTLE_BOTS.slice(0, Math.max(0, state.size - 1));
}
function botCount(){ return Math.max(0, state.size * 2 - 1); }

let toastT = 0;
function toast(msg){
  const el = $('toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1900);
}

/* ---------- setup ---------- */
function renderSetup(){
  const map = MAP_BY_KEY[state.map] || MAPS[0];
  $('setupMeta').innerHTML = `
    <div><span>MODE</span><b>CHALICE</b></div>
    <div><span>MATCH</span><b>${state.size}v${state.size} · FIRST TO ${state.firstTo} · ${state.len} MIN</b></div>
    <div><span>BOTS</span><b>${state.bots ? state.diff.toUpperCase() : 'OFF'}</b></div>`;
  $('mapValue').textContent = state.map.toUpperCase();
  $('plateImg').src = map.art;
  $('plateName').textContent = state.map.toUpperCase();
  $('plateCap').innerHTML = `CHALICE ON <b>${state.map.toUpperCase()}</b> · FIRST TO ${state.firstTo} · ${state.len} MIN`;
  $('playerCount').innerHTML = `1 PLAYER + ${botCount()} BOTS <span>[${state.size*2} MAX]</span>`;
  $('teamThistle').innerHTML = teamHtml('THISTLE', 'YOUR TEAM', 'thistle', true);
  $('teamMarigold').innerHTML = teamHtml('MARIGOLD', 'ENEMY', 'marigold', false);
}
function teamHtml(name, tag, cls, mine){
  const bots = (mine ? THISTLE_BOTS : MARIGOLD_BOTS).slice(0, Math.max(0, state.size - (mine ? 1 : 0)));
  const rows = [];
  if(mine){
    const c = BY_KEY[state.cls];
    rows.push(`<div class="trow you"><span class="crest">${crest(c.colour)}</span><span class="nm">YOU<small>${state.cls.toUpperCase()}</small></span><span class="tag">—</span></div>`);
  }
  for(const b of bots){
    const c = BY_KEY[b.cls];
    rows.push(`<div class="trow"><span class="crest">${crest(c.colour)}</span><span class="nm">${b.name.toUpperCase()}<small>${b.cls.toUpperCase()}</small></span><span class="tag">BOT</span></div>`);
  }
  return `<header>${name}<span>${tag}</span></header>${rows.join('')}`;
}

/* ---------- map ---------- */
function renderMap(){
  $('mapList').innerHTML = MAPS.map(m => `
    <button type="button" class="mapRow${m.key === state.map ? ' on' : ''}${m.on ? '' : ' off'}" data-map="${m.key}" ${m.on ? '' : 'disabled'}>
      <span class="art"><img src="${m.art}" alt=""></span>
      <span><span class="nm">${m.key.toUpperCase()}</span><span class="ln">${m.line}</span></span>
      <span class="tick">${m.key === state.map ? 'PICKED' : ''}</span>
    </button>`).join('');
  const m = MAP_BY_KEY[state.map] || MAPS[0];
  $('mapPreview').innerHTML = `<div class="big"><img src="${m.art}" alt=""></div><div class="nm">${m.key.toUpperCase()}</div><div class="ln">${m.line}</div>`;
}

/* ---------- options ---------- */
const opts = {
  firstTo:[20,25,30,40],
  len:[5,10,15],
  size:[1,2,3,4,5,6]
};
function optRow(label, value, key, extra = ''){
  return `<button type="button" class="optRow" data-key="${key}">
    <span>${label}</span>
    <span class="val"><i>‹</i> ${value} <i>›</i>${extra}</span>
  </button>`;
}
function renderOptions(){
  $('matchOpts').innerHTML = `
    ${optRow('FIRST TO', state.firstTo, 'firstTo')}
    ${optRow('GAME LENGTH', state.len + ' MIN', 'len')}
    ${optRow('TEAM SIZE', state.size + 'v' + state.size, 'size')}`;
  $('botOpts').innerHTML = `
    ${optRow('ENABLED', state.bots ? 'ON' : 'OFF', 'bots', '<span class="chev"></span>')}
    ${state.bots ? `<div class="botSub" id="botSub">
      ${optRow('DIFFICULTY', state.diff.toUpperCase(), 'diff')}
      ${optRow('ALLOW DUPLICATES', state.dupes ? 'ON' : 'OFF', 'dupes')}
      ${optRow('CUSTOM CLASSES', state.custom ? 'ON' : 'OFF', 'custom')}
      ${state.custom ? `<div class="optRow" data-key="none" style="opacity:.55"><span>BOT CLASSES</span><span class="val">ALL FIVE</span></div>` : ''}
    </div>` : ''}`;
  $('doneRow').innerHTML = `<button type="button" class="optRow done" data-done="1"><span>DONE</span><span class="chev"></span></button>`;
}

/* ---------- focus ---------- */
function activeScreen(){ return document.getElementById(state.screen); }
function focusables(){
  const s = activeScreen();
  if(!s) return [];
  if(state.screen === 'setup') return [...s.querySelectorAll('.act')];
  if(state.screen === 'map') return [...s.querySelectorAll('.mapRow:not([disabled])')];
  if(state.screen === 'options') return [...s.querySelectorAll('.optRow')];
  return [];
}
function applyFocus(){
  const f = focusables();
  [...document.querySelectorAll('.focus')].forEach(el => el.classList.remove('focus'));
  if(!f.length) return;
  const i = Math.max(0, Math.min(f.length - 1, state.focus[state.screen] || 0));
  state.focus[state.screen] = i;
  f[i].classList.add('focus');
  f[i].scrollIntoView({ block:'nearest' });
}
function move(d){
  const f = focusables();
  if(!f.length) return;
  let i = state.focus[state.screen] || 0;
  i = (i + d + f.length) % f.length;
  state.focus[state.screen] = i;
  applyFocus();
}
function current(){ return focusables()[state.focus[state.screen] || 0]; }
function activate(){
  const el = current();
  if(!el) return;
  if(state.screen === 'setup'){
    const go = el.dataset.go;
    if(go) open(go);
    return;
  }
  if(state.screen === 'map'){
    const key = el.dataset.map;
    if(key){ state.map = key; renderSetup(); renderMap(); open('setup'); toast('Map set to ' + key); }
    return;
  }
  if(state.screen === 'options'){
    if(el.dataset.done){ open('setup'); return; }
    const key = el.dataset.key;
    if(key === 'bots'){ state.bots = !state.bots; renderOptions(); applyFocus(); return; }
    if(key && key !== 'none') cycleOpt(key, 1);
  }
}
function cycleOpt(key, d){
  if(key === 'firstTo') state.firstTo = opts.firstTo[(opts.firstTo.indexOf(state.firstTo)+d+4)%4];
  else if(key === 'len') state.len = opts.len[(opts.len.indexOf(state.len)+d+3)%3];
  else if(key === 'size') state.size = opts.size[(opts.size.indexOf(state.size)+d+6)%6];
  else if(key === 'bots') state.bots = !state.bots;
  else if(key === 'diff'){ const v=['Easy','Normal','Hard']; state.diff = v[(v.indexOf(state.diff)+d+3)%3]; }
  else if(key === 'dupes') state.dupes = !state.dupes;
  else if(key === 'custom') state.custom = !state.custom;
  renderSetup(); renderOptions(); applyFocus();
}

/* ---------- screens ---------- */
function open(name){
  if(name === 'classes'){ location.href = 'class-select-mockup.html'; return; }
  state.screen = name;
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === name));
  if(name === 'setup') renderSetup();
  if(name === 'map') renderMap();
  if(name === 'options') renderOptions();
  fitCup();
  applyFocus();
}

/* ---------- input ---------- */
const KEY = { up:['ArrowUp','KeyW'], down:['ArrowDown','KeyS'], left:['ArrowLeft','KeyA'], right:['ArrowRight','KeyD'], act:['Enter','Space'], back:['Escape','Backspace'] };
addEventListener('keydown', e => {
  if(KEY.up.includes(e.code)){ e.preventDefault(); move(-1); }
  else if(KEY.down.includes(e.code)){ e.preventDefault(); move(1); }
  else if(KEY.left.includes(e.code)){
    e.preventDefault();
    const el = current();
    if(state.screen === 'options' && el?.dataset.key && el.dataset.key !== 'none') cycleOpt(el.dataset.key, -1);
  }
  else if(KEY.right.includes(e.code)){
    e.preventDefault();
    const el = current();
    if(state.screen === 'options' && el?.dataset.key && el.dataset.key !== 'none') cycleOpt(el.dataset.key, 1);
  }
  else if(KEY.act.includes(e.code)){ e.preventDefault(); activate(); }
  else if(e.code === 'KeyY' && state.screen !== 'options'){ e.preventDefault(); open('options'); }
  else if(KEY.back.includes(e.code)){
    e.preventDefault();
    if(state.screen === 'setup'){ location.href = 'menu-redesign-mockup.html'; }
    else open('setup');
  }
});
document.querySelectorAll('.act[data-go]').forEach(b => b.addEventListener('pointerenter', () => {
  const i = [...document.querySelectorAll('#setup .act')].indexOf(b);
  if(i >= 0){ state.focus.setup = i; applyFocus(); }
}));
back.addEventListener('click', () => { if(state.screen === 'setup'){ location.href = 'menu-redesign-mockup.html'; } else open('setup'); });
$('setupActions').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if(b) open(b.dataset.go); });
$('mapList').addEventListener('click', e => {
  const b = e.target.closest('.mapRow'); if(!b || b.disabled) return;
  state.map = b.dataset.map; renderSetup(); open('setup'); toast('Map set to ' + state.map);
});
$('options').addEventListener('click', e => {
  const b = e.target.closest('.optRow'); if(!b) return;
  if(b.dataset.done){ open('setup'); return; }
  const key = b.dataset.key;
  if(key === 'bots'){ state.bots = !state.bots; renderOptions(); applyFocus(); return; }
  if(key && key !== 'none') cycleOpt(key, 1);
});
document.querySelector('.act.primary').addEventListener('click', () => { location.href = 'class-select-mockup.html'; });

/* ============================================================
   The cup: same rig as the menu, pulled back and dimmed.
   ============================================================ */
const cv = $('cup');
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas:cv, antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
} catch(e){ renderer = null; }

let cupPivot = null, cupMesh = null, cam = null, scene = null, lights = null;
let yaw = 0, lastT = performance.now();
const CUP_H = 0.45;

// how the cup sits on each screen
const LEVELS = {
  setup:  { scale:8.2, y:.40, dim:.46, op:.78 },
  map:    { scale:4.6, y:.28, dim:.22, op:.42 },
  options:{ scale:4.4, y:.28, dim:.12, op:.24 }
};
let cupShiftPx = 0, cupCap = 4.6, cupShiftW = 0;
function fitCup(){
  cupShiftPx = 0; cupCap = 4.6;
  if(state.screen === 'setup'){
    const a = $('plate').getBoundingClientRect();
    const b = document.querySelector('.setupRight').getBoundingClientRect();
    const gap = b.left - a.right;
    if(gap > 60){
      cupShiftPx = (a.right + b.left) / 2 - innerWidth / 2;
      const vw = 2 * Math.tan(15 * Math.PI/180) * 9 * (innerWidth / innerHeight);
      const bowlPx = .216 * innerWidth / vw;
      cupCap = Math.max(2.7, (gap + 26) / bowlPx);
      cupShiftW = cupShiftPx * vw / innerWidth;
    }
  }
}
// the close-up the page opens on, then pulls back into place
const cur = { scale:10.0, y:.40, dim:1, op:1 };
let shiftCur = 0;
const curCam = { x:0, y:1.1, z:3.9, lookY:.36, fov:32 };
const BG_CAM = { x:0, y:0, z:9, lookY:.28, fov:30 };
const lookV = new THREE.Vector3();
const camPos = new THREE.Vector3();
let pointerX = 0, pointerY = 0, parX = 0, parY = 0;

if(renderer){
  scene = new THREE.Scene();
  const hemi = new THREE.HemisphereLight(0x8a8fd0, 0x05040a, 0.5); scene.add(hemi);
  const key = new THREE.PointLight(0xffd9a0, 1.15, 10); key.position.set(1.6, 1.2, 2.4); scene.add(key);
  const rim = new THREE.PointLight(0x7a5cff, 1.9, 10); rim.position.set(-1.8, 0.7, -1.5); scene.add(rim);
  const fill = new THREE.PointLight(0xffb347, 0.5, 8); fill.position.set(0.4, -0.8, 1.4); scene.add(fill);
  lights = { hemi, key, rim, fill };

  cam = new THREE.PerspectiveCamera(32, 1, 0.05, 20);
  cam.position.set(curCam.x, curCam.y, curCam.z);
  cam.lookAt(0, curCam.lookY, 0);

  cupPivot = new THREE.Group();
  scene.add(cupPivot);
  cupMesh = buildChalice();
  cupMesh.position.y = -CUP_H/2;
  cupPivot.add(cupMesh);
}
addEventListener('pointermove', e => {
  pointerX = (e.clientX / innerWidth - .5) * 2;
  pointerY = (e.clientY / innerHeight - .5) * 2;
});

function glowTex(){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'), g = x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(.4,'rgba(255,255,255,.55)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}

function buildChalice(){
  const g = new THREE.Group();
  const gold = new THREE.MeshStandardMaterial({ color:0xba8a33, metalness:.7, roughness:.34 });
  const bright = new THREE.MeshStandardMaterial({ color:0xe0b45a, metalness:.82, roughness:.26 });
  const inner = new THREE.MeshStandardMaterial({ color:0x8a5c1e, metalness:.5, roughness:.5, side:THREE.DoubleSide });
  const V2 = (x,y) => new THREE.Vector2(x,y);

  const foot = new THREE.Mesh(new THREE.LatheGeometry([
    V2(0,0), V2(.075,0), V2(.07,.012), V2(.03,.04), V2(.016,.06)
  ], 40), gold); g.add(foot);

  const stem = new THREE.Mesh(new THREE.CylinderGeometry(.014,.016,.1,16), gold);
  stem.position.y = .092; g.add(stem);

  const knot = new THREE.Mesh(new THREE.SphereGeometry(.026,18,14), bright);
  knot.scale.y = .75; knot.position.y = .1; g.add(knot);

  const bowl = new THREE.Mesh(new THREE.LatheGeometry([
    V2(0,.15), V2(.03,.152), V2(.07,.17), V2(.095,.22), V2(.105,.29), V2(.108,.34)
  ], 48), inner); g.add(bowl);

  const rim = new THREE.Mesh(new THREE.TorusGeometry(.108,.0036,10,48), bright);
  rim.rotation.x = Math.PI/2; rim.position.y = .34; g.add(rim);

  const band = new THREE.Mesh(new THREE.TorusGeometry(.1025,.0025,8,48), bright);
  band.rotation.x = Math.PI/2; band.position.y = .24; g.add(band);

  const gemCols = [0x3f7cff, 0xff3b5c, 0x3fe08a, 0x8a6bff];
  const gems = [];
  for(let i = 0; i < 8; i++){
    const a = (i/8) * Math.PI*2 + .22;
    const setting = new THREE.Group();
    setting.position.set(Math.sin(a)*.104, .285, Math.cos(a)*.104);
    setting.rotation.y = a;
    const col = gemCols[i % 4];
    const gm = new THREE.MeshStandardMaterial({ color:col, emissive:col, emissiveIntensity:1.15, metalness:.2, roughness:.25 });
    const gem = new THREE.Mesh(new THREE.OctahedronGeometry(.011,0), gm);
    gem.scale.set(1, 1.25, .6); gem.position.z = .006;
    const bezel = new THREE.Mesh(new THREE.TorusGeometry(.014,.0018,6,12), bright);
    bezel.position.z = .004;
    setting.add(gem, bezel);
    g.add(setting);
    gems.push(gm);
  }

  const ichorM = new THREE.MeshStandardMaterial({ color:0xd9a53a, emissive:0x8a5208, emissiveIntensity:.9, metalness:.3, roughness:.24 });
  const ichor = new THREE.Mesh(new THREE.CircleGeometry(.097, 48), ichorM);
  ichor.rotation.x = -Math.PI/2; ichor.position.y = .305; g.add(ichor);

  const inLight = new THREE.PointLight(0xffb85c, 0.7, 0.9);
  inLight.position.set(0, .315, 0); g.add(inLight);

  const tex = glowTex();
  const sprites = [];
  for(let i = 0; i < 9; i++){
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, color:0xffcf78, transparent:true, opacity:.5, depthWrite:false, blending:THREE.AdditiveBlending }));
    s.scale.setScalar(.018);
    g.add(s); sprites.push({ s, a:Math.random()*7, h:Math.random(), sp:0.3 + Math.random()*0.5 });
  }
  const innerMotes = [];
  for(let i = 0; i < 6; i++){
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, color:0xffdca0, transparent:true, opacity:.35, depthWrite:false, blending:THREE.AdditiveBlending }));
    s.scale.setScalar(.01);
    g.add(s); innerMotes.push({ s, a:Math.random()*7, h:Math.random(), sp:0.15 + Math.random()*0.25 });
  }
  g.userData = { sprites, innerMotes, gems, ichor, ichorM };
  return g;
}

function layout(){
  if(!renderer) return;
  const W = cv.clientWidth || innerWidth;
  const H = cv.clientHeight || innerHeight;
  renderer.setSize(W, H, false);
  cam.aspect = W / H;
  cam.updateProjectionMatrix();
}
addEventListener('resize', () => { layout(); fitCup(); });

const lerp = (a,b,k) => a + (b-a)*k;

function frame(now){
  requestAnimationFrame(frame);
  if(!renderer) return;
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  const t = now / 1000;
  const L = LEVELS[state.screen] || LEVELS.setup;
  const k = 1 - Math.exp(-dt * 3.6);

  curCam.x = lerp(curCam.x, BG_CAM.x, k);
  curCam.y = lerp(curCam.y, BG_CAM.y, k);
  curCam.z = lerp(curCam.z, BG_CAM.z, k);
  curCam.lookY = lerp(curCam.lookY, BG_CAM.lookY, k);
  curCam.fov = lerp(curCam.fov, BG_CAM.fov, k);
  camPos.set(curCam.x, curCam.y, curCam.z);
  cam.position.copy(camPos);
  lookV.set(0, curCam.lookY, 0);
  cam.lookAt(lookV);
  cam.fov = curCam.fov; cam.updateProjectionMatrix();

  cur.scale = lerp(cur.scale, Math.min(L.scale, cupCap), k);
  cur.y = lerp(cur.y, L.y, k);
  cur.dim = lerp(cur.dim, L.dim, k);
  cur.op = lerp(cur.op, L.op, k);
  shiftCur = lerp(shiftCur, cupShiftW, k);
  cupPivot.scale.setScalar(cur.scale);
  cv.style.opacity = cur.op.toFixed(3);

  parX = lerp(parX, pointerX, .04);
  parY = lerp(parY, pointerY, .04);
  const bob = Math.sin(t * .55) * .035;
  cupPivot.position.set(shiftCur + parX * .13, cur.y + bob, 0);
  cupPivot.rotation.z = -.16 + Math.sin(t * .37) * .02;
  cupPivot.rotation.x = .09 + parY * .03;

  yaw += dt * .55;
  cupMesh.rotation.y = yaw;

  const dim = cur.dim;
  if(lights){
    lights.key.intensity = 1.15 * dim;
    lights.rim.intensity = 1.9 * dim;
    lights.fill.intensity = .5 * dim;
    lights.hemi.intensity = .5 * dim;
  }
  const u = cupMesh.userData;
  u.gems.forEach((gm, i) => {
    const k = Math.pow(Math.max(0, Math.sin((t/3.2 + i*0.37) * Math.PI*2)), 2);
    gm.emissiveIntensity = (0.35 + 1.55*k) * (0.55 + 0.45*dim);
  });
  u.ichor.rotation.z = t * .12;
  u.ichorM.emissiveIntensity = (.75 + .25*Math.sin(t*1.4)) * (.5 + .5*dim);

  for(const q of u.sprites){
    q.h = (q.h + dt * q.sp * .35) % 1;
    q.a += dt * .35;
    const r = .085 * (1 - q.h * .5);
    q.s.position.set(Math.cos(q.a) * r, .35 + q.h * .22, Math.sin(q.a) * r);
    q.s.material.opacity = .48 * (1 - q.h) * (.6 + .4 * Math.sin(t*3 + q.a)) * (.4 + .6*dim);
    q.s.scale.setScalar(.012 + q.h * .012);
  }
  for(const q of u.innerMotes){
    q.h = (q.h + dt * q.sp) % 1;
    q.a += dt * .5;
    const r = .07 * (1 - q.h * .35);
    q.s.position.set(Math.cos(q.a) * r, .31 + q.h * .05, Math.sin(q.a) * r);
    q.s.material.opacity = .5 * (1 - q.h) * (.4 + .6*dim);
    q.s.scale.setScalar(.008 + q.h * .006);
  }

  renderer.render(scene, cam);
}

/* initial */
renderSetup(); renderMap(); renderOptions(); open('setup'); layout(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>

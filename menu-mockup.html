<!doctype html>
<meta charset="utf-8">
<title>Chalice menu mockup</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Alegreya+Sans:wght@500;700;800&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#120c08;
  --ink:#f6ecd6;
  --dim:#c9b088;
  --blue:#a98cff;
  --t1:#ff7048;
  --gold:#efe1bf;
  --hot:#e8b84a;
  --panel:rgba(26,17,10,.82);
  --line:rgba(232,184,74,.35);
  --softline:rgba(232,184,74,.18);
  --display:'Cinzel',Georgia,'Times New Roman',serif;
  --ui:'Alegreya Sans','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#0b0705;color:var(--ink);font-family:var(--ui);overflow-x:hidden}
button{font-family:var(--display);color:inherit}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;margin:0}
img{max-width:100%}

/* mockup chrome */
.mkbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:16px;padding:8px max(14px,env(safe-area-inset-left)) 10px max(14px,env(safe-area-inset-right));background:rgba(9,6,4,.97);border-bottom:1px solid var(--line);font-family:var(--display);flex-wrap:wrap}
.mkbar .tag{font-size:10.5px;letter-spacing:.24em;color:var(--dim);white-space:nowrap}
.mkbar .opts,.mkbar .phase{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.mkbar .opts::-webkit-scrollbar,.mkbar .phase::-webkit-scrollbar{display:none}
.mkbar .opts button,.mkbar .phase button{all:unset;cursor:pointer;padding:7px 13px;border:1px solid var(--softline);font-size:11.5px;letter-spacing:.13em;color:var(--dim);white-space:nowrap}
.mkbar .opts button:hover,.mkbar .phase button:hover{color:var(--ink);border-color:rgba(232,184,74,.6)}
.mkbar .opts button.on{background:rgba(232,184,74,.16);border-color:rgba(232,184,74,.8);color:#ffe9b4}
.mkbar .phase{padding-left:14px;border-left:1px solid var(--softline)}
.mkbar .phase[hidden]{display:none}
.mkbar .phase button{font-size:10px;padding:5px 9px}
.mkbar .phase button.on{background:rgba(232,184,74,.12);border-color:rgba(232,184,74,.55);color:#ffe9b4}
.mkbar .note{margin-left:auto;font-family:var(--ui);font-size:12px;color:var(--dim);white-space:nowrap}
.optnote{padding:7px 18px;border-bottom:1px solid rgba(232,184,74,.14);background:linear-gradient(90deg,rgba(232,184,74,.07),transparent 70%);font-size:13px;line-height:1.45;color:var(--dim)}
.optnote span{font-family:var(--display);font-size:10.5px;letter-spacing:.2em;color:#e8c78a;margin-right:10px}

/* scenery */
.scenery{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.stage{position:relative;z-index:1;padding:11px 18px 40px}

/* frame */
.app{width:min(1180px,100%);margin:0 auto;min-width:0}
.app[data-team="thistle"]{--team:var(--blue)}
.app[data-team="marigold"]{--team:var(--t1)}

.kicker{font-family:var(--display);font-size:10.5px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
.box{background:linear-gradient(180deg,rgba(34,23,14,.78),rgba(17,11,7,.88));border:1px solid var(--line);padding:16px 18px;min-width:0}
.box h4{margin:0 0 11px;font-size:10.5px;letter-spacing:.26em;color:var(--dim);font-weight:600}
.box p{margin:0}

.seg{display:inline-flex;border:1px solid var(--line);background:rgba(0,0,0,.26)}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.07em;color:var(--dim)}
.seg button + button{border-left:1px solid var(--softline)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:rgba(232,184,74,.16);color:#ffe9b4;box-shadow:inset 0 -2px 0 rgba(232,184,74,.7)}

.play{all:unset;cursor:pointer;padding:15px 42px;font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.22em;color:#241606;background:linear-gradient(180deg,#fff0c4,#e8b84a 55%,#b07a22);clip-path:polygon(6% 0,100% 0,94% 100%,0 100%);box-shadow:0 12px 34px rgba(232,184,74,.16);transition:filter .15s;text-align:center}
.play:hover{filter:brightness(1.08)}
.play:active{filter:brightness(.96)}
.play[aria-disabled="true"]{filter:grayscale(.55) brightness(.8);cursor:default}
.small{all:unset;cursor:pointer;padding:7px 12px;border:1px solid var(--line);font-size:11.5px;letter-spacing:.11em;font-weight:700;color:var(--dim);font-family:var(--display);text-align:center}
.small:hover{color:var(--gold);border-color:rgba(232,184,74,.7)}
.small.solid{background:rgba(232,184,74,.14);color:#ffe9b4;border-color:rgba(232,184,74,.55)}

.panelhead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--softline)}
.panelhead h2{font-size:27px;letter-spacing:.1em;color:#f5e7c8;margin-top:5px}
.panelhead .side{font-size:12px;color:var(--dim);line-height:1.55;text-align:right}

.ctaBar{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:15px 18px;border:1px solid rgba(232,184,74,.26);background:linear-gradient(90deg,rgba(232,184,74,.09),rgba(0,0,0,.28));margin-top:auto}
.ctaSum{font-size:12.5px;color:var(--dim);line-height:1.55}
.ctaSum .line1{display:block;font-family:var(--display);font-size:14px;letter-spacing:.08em;color:#f2e2bf;margin-bottom:3px}
.ctaRight{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

/* rail */
.railLayout{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:500px;border:1px solid var(--line);background:rgba(14,9,6,.56)}
.rail{display:flex;flex-direction:column;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(31,21,13,.9),rgba(15,10,7,.96));padding:22px 15px 16px}
.railBrand{display:flex;align-items:center;gap:11px;padding:0 7px 18px;border-bottom:1px solid rgba(232,184,74,.14);margin-bottom:15px}
.railBrand .crest{width:32px;height:40px;color:#e8b84a;flex:none}
.railBrand .crest svg{width:100%;height:100%;display:block}
.railBrand .bn{display:block;font-family:var(--display);font-size:22px;letter-spacing:.16em;color:#f3e3bd;line-height:1}
.railBrand .bs{display:block;font-size:9px;letter-spacing:.24em;color:var(--dim);margin-top:4px}
.railNav{display:flex;flex-direction:column;gap:3px}
.railBtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 12px;color:var(--dim);font-family:var(--display);font-size:12.5px;letter-spacing:.14em;border-left:2px solid transparent}
.railBtn svg{width:17px;height:17px;flex:none;opacity:.8}
.railBtn:hover{background:rgba(232,184,74,.06);color:var(--ink)}
.railBtn.on{color:#ffe9b4;background:linear-gradient(90deg,rgba(232,184,74,.16),transparent);border-left-color:var(--hot)}
.railBtn.on svg{opacity:1}
.soon{margin-left:auto;font-family:var(--display);font-size:7.5px;letter-spacing:.14em;color:var(--dim);border:1px solid rgba(232,184,74,.22);padding:2px 4px;align-self:center}
.railFoot{margin-top:auto;padding:15px 8px 0;border-top:1px solid rgba(232,184,74,.14);font-size:10.5px;color:var(--dim);line-height:1.65;letter-spacing:.04em}
.railFoot .v{font-family:var(--display);letter-spacing:.1em;color:#e8c78a}
.railMain{padding:24px 26px 22px;display:flex;flex-direction:column;gap:16px;min-width:0}

/* play: menu on the left, the chalice turning on the right */
.playSplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:stretch;flex:1}
.playCol{display:flex;flex-direction:column;gap:14px;min-width:0}
.setupBtn{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:-4px;padding:9px 16px;font-family:var(--display);font-weight:900;font-size:12.5px;letter-spacing:.24em;color:#241606;background:linear-gradient(180deg,#fff0c4,#e8b84a 55%,#b07a22);clip-path:polygon(1.5% 0,100% 0,98.5% 100%,0 100%);box-shadow:0 8px 22px rgba(232,184,74,.16);transition:filter .15s;text-align:center}
.setupBtn:hover{filter:brightness(1.08)}
.setupBtn:active{filter:brightness(.96)}
.chaliceArt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:480px;perspective:1200px;overflow:hidden}
.halo{position:absolute;top:50%;left:50%;width:min(400px,96%);aspect-ratio:1;transform:translate(-50%,-54%);border-radius:50%;background:radial-gradient(circle,rgba(232,184,74,.2),rgba(232,184,74,.05) 46%,transparent 70%)}
.halo::after{content:"";position:absolute;inset:12%;border:1px solid rgba(232,184,74,.16);border-radius:50%}
.turn{position:relative;z-index:2;display:grid;place-items:center;width:100%;transform-style:preserve-3d;animation:chalTurn 32s linear infinite;will-change:transform}
.cup{width:min(350px,80%);height:auto;display:block;filter:drop-shadow(0 16px 26px rgba(0,0,0,.55))}
.pedestal{position:relative;z-index:1;width:min(330px,76%);height:26px;margin-top:-18px;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(255,238,194,.4),rgba(232,184,74,.12) 46%,transparent 72%)}
@keyframes chalTurn{
  from{transform:rotateY(0deg)}
  to{transform:rotateY(360deg)}
}
@media (prefers-reduced-motion: reduce){
  .turn{animation:none}
}

.modList{display:flex;flex-direction:column;gap:8px}
.modeRow{all:unset;cursor:pointer;position:relative;display:grid;grid-template-columns:38px minmax(0,1fr);align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--softline);background:rgba(0,0,0,.22)}
.modeRow:hover{border-color:rgba(232,184,74,.5)}
.modeRow.on{border-color:rgba(232,184,74,.72);background:linear-gradient(90deg,rgba(232,184,74,.12),rgba(0,0,0,.2))}
.modeRow.on::after{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:var(--hot)}
.modeRow .emblem{width:34px;height:34px;color:#e8b84a;opacity:.9}
.modeRow .emblem svg{width:100%;height:100%;display:block}
.modeRow .mName{display:block;font-family:var(--display);font-size:16px;letter-spacing:.1em;color:var(--ink);line-height:1.1}
.modeRow .mLine{display:block;font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.32}

.cols2{display:grid;grid-template-columns:1.1fr .9fr;gap:15px;align-items:start}
.rules{margin:0;padding:0;list-style:none;font-size:12.5px;line-height:1.45;color:#e5d6bb}
.rules li{position:relative;padding-left:12px;margin:0 0 8px}
.rules li:last-child{margin-bottom:0}
.rules li::before{content:"";position:absolute;left:0;top:.55em;width:4px;height:4px;background:var(--hot);transform:rotate(45deg)}

.classLine{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid rgba(232,184,74,.1)}
.classLine:last-child{border-bottom:0;padding-bottom:0}
.classLine .em{width:26px;height:26px;flex:none;color:#e8c78a}
.classLine .em svg{width:100%;height:100%;display:block}
.classLine .cn{font-family:var(--display);font-size:12.5px;letter-spacing:.08em;min-width:84px}
.classLine .cr{font-size:9px;letter-spacing:.16em;color:var(--dim);min-width:86px}
.classLine .cl{font-size:12px;color:var(--dim);line-height:1.35;flex:1;min-width:0}

.fieldRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;color:var(--dim);font-family:var(--display)}
.field input{font-family:var(--ui);font-weight:700;font-size:14px;padding:5px 8px;background:rgba(0,0,0,.35);color:var(--ink);border:1px solid var(--line);border-radius:0;width:92px}
.keys{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;color:var(--dim)}
.keys span{display:flex;align-items:center;gap:6px}
kbd{font-family:var(--display);font-size:9.5px;letter-spacing:.08em;color:#e8c78a;border:1px solid var(--softline);background:rgba(0,0,0,.25);padding:3px 6px}

.notice{border-left:2px solid var(--hot);background:rgba(232,184,74,.06);padding:12px 14px;font-size:13px;color:var(--dim);line-height:1.5}
.settingRow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid rgba(232,184,74,.12)}
.settingRow:last-child{border-bottom:0;padding-bottom:0}
.settingRow .lbl{font-size:13px;font-weight:600}
.settingRow .lbl small{display:block;font-size:11.5px;color:var(--dim);font-weight:500;margin-top:2px}
.settingRow input[type=range]{accent-color:var(--hot);width:180px}

.codeBox{font-family:var(--display);font-size:11.5px;letter-spacing:.16em;color:#e8c78a;border:1px solid rgba(232,184,74,.3);background:rgba(0,0,0,.3);padding:6px 10px}
.lanGame{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px;padding:8px 10px;border:1px solid rgba(232,184,74,.18);background:rgba(0,0,0,.2);font-size:12px;color:var(--dim)}
.party{display:flex;gap:8px;flex-wrap:wrap}
.partySlot{font-family:var(--display);font-size:9.5px;letter-spacing:.12em;padding:7px 10px;border:1px solid rgba(232,184,74,.2);color:var(--dim);background:rgba(0,0,0,.2)}
.partySlot.you{color:#ffe9b4;border-color:rgba(232,184,74,.5)}
.partySlot.open{border-style:dashed}
.friendBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}

/* ---------- pre-game ---------- */
.pg{display:flex;flex-direction:column;gap:10px}
.pgTop{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:10px}
.mapShot{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,#241a11,#0e0906);min-height:120px;overflow:hidden}
.mapShot .art{display:block;position:absolute;inset:0}
.mapShot .art svg{width:100%;height:100%;display:block;object-fit:cover}
.mapShot::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,6,4,.82) 0%,rgba(10,6,4,.45) 46%,rgba(10,6,4,.1) 78%)}
.mapCap{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;height:100%;padding:11px 16px;min-height:120px}
.mapCap strong{font-family:var(--display);font-size:clamp(22px,2.6vw,31px);letter-spacing:.1em;color:#f7ead0;line-height:1}
.mapCap .line{font-size:11.5px;color:#d9c7a8;margin-top:5px;max-width:46ch;line-height:1.35}
.pgSetup{border:1px solid var(--line);background:linear-gradient(180deg,rgba(30,20,12,.8),rgba(13,9,6,.9));padding:11px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pgSetup h2{font-size:21px;letter-spacing:.1em;color:#f5e7c8}
.pgSetup .line{font-size:11.5px;color:var(--dim);line-height:1.35}

.pgGrid{display:grid;grid-template-columns:212px minmax(0,1fr) 270px;gap:10px;align-items:stretch}

/* left: class list */
.pgClasses{border:1px solid var(--line);background:linear-gradient(180deg,rgba(26,17,10,.8),rgba(12,8,5,.9));padding:11px 9px;display:flex;flex-direction:column;gap:5px;min-width:0}
.pgClasses > .kicker{padding:1px 4px 6px;font-size:9px;letter-spacing:.24em}
.clsPick{all:unset;cursor:pointer;display:grid;grid-template-columns:11px 26px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 8px 8px 7px;border:1px solid transparent;border-left:2px solid transparent;position:relative}
.clsPick:hover{background:rgba(232,184,74,.06);border-color:rgba(232,184,74,.2)}
.clsPick.on{background:linear-gradient(90deg,rgba(232,184,74,.16),transparent);border-color:rgba(232,184,74,.42);border-left-color:var(--hot)}
.clsPick .ic{width:26px;height:26px;color:#e8c78a;opacity:.85}
.clsPick.on .ic{opacity:1;color:#ffe6a8}
.clsPick .ic svg{width:100%;height:100%;display:block}
.clsPick .nm{display:block;font-family:var(--display);font-size:12px;letter-spacing:.07em;color:var(--ink);line-height:1.15}
.clsPick.on .nm{color:#ffe9b4}
.clsPick .rl{display:block;font-size:8.5px;letter-spacing:.15em;color:var(--dim);text-transform:uppercase;margin-top:2px}
.clsPick .ct{font-family:var(--display);font-size:8.5px;letter-spacing:.06em;color:#e8c78a;border:1px solid rgba(232,184,74,.24);padding:2px 4px;white-space:nowrap}
.clsPick .ct.open{color:var(--dim);border-color:rgba(232,184,74,.18)}
.clsPick .ct.lock{display:inline-flex;align-items:center;gap:3px;color:#e8c78a;border:0;padding:0;background:none;font-size:9.5px}
.clsPick .ct.lock svg{width:10px;height:12px;display:block}
.clsPick .key{font-family:var(--display);font-size:8px;letter-spacing:0;color:rgba(201,176,136,.55);text-align:center}

/* middle: portrait, loadout, abilities */
.pgMid{border:1px solid var(--line);background:linear-gradient(180deg,rgba(24,16,10,.8),rgba(11,7,5,.92));padding:12px 14px 12px;display:flex;flex-direction:column;gap:9px;min-width:0}
.pgHero{display:grid;grid-template-columns:168px minmax(0,1fr);gap:14px;align-items:start}
.pgPortrait{align-self:start;width:168px;height:220px;object-fit:contain;object-position:bottom center;background:radial-gradient(ellipse at 50% 78%,rgba(232,184,74,.14),transparent 66%);border:1px solid rgba(232,184,74,.22);border-bottom-color:rgba(232,184,74,.4)}
.pgHeroText{display:flex;flex-direction:column;gap:5px;min-width:0;padding-top:4px}
.pgHeroText .role{font-family:var(--display);font-size:9px;letter-spacing:.26em;color:#e8c78a}
.pgHeroText h2{font-size:clamp(24px,2.7vw,33px);letter-spacing:.1em;line-height:1;color:#f7ead0}
.pgHeroText .line{font-size:12.5px;color:#d9c7a8;line-height:1.45;margin:3px 0 2px}
.pgHeroText .hp{font-family:var(--display);font-size:10px;letter-spacing:.12em;color:var(--dim)}
.pgHeroText .hp b{color:#f2e2bf;font-weight:700}
.pgHeroText .fieldRow{margin-top:auto;padding-top:8px}

.pgSection{display:flex;flex-direction:column;gap:6px;border-top:1px solid rgba(232,184,74,.14);padding-top:9px}
.pgSection > h4{font-size:9.5px;letter-spacing:.24em;color:var(--dim);font-weight:600}
.loRow{display:grid;grid-template-columns:50px minmax(0,1fr);gap:9px;align-items:baseline}
.loRow .k{font-family:var(--display);font-size:9px;letter-spacing:.1em;color:#e8c78a;border:1px solid rgba(232,184,74,.28);padding:2px 5px;text-align:center}
.loRow .t{font-size:11.5px;line-height:1.38;color:#d9c7a8;min-width:0}
.loRow .t b{font-family:var(--display);font-size:11.5px;letter-spacing:.06em;color:#f2e2bf;margin-right:6px}
.abRow{display:grid;grid-template-columns:36px minmax(0,1fr);gap:9px;align-items:start}
.abRow .ic{width:34px;height:34px;border:1px solid rgba(232,184,74,.25);background:radial-gradient(circle at 50% 40%,rgba(232,184,74,.14),rgba(0,0,0,.28));color:#f0d9a5;padding:5px}
.abRow .ic svg{width:100%;height:100%;display:block}
.abRow .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.abRow .kind{font-family:var(--display);font-size:8px;letter-spacing:.18em;color:var(--dim)}
.abRow .nm{font-family:var(--display);font-size:12px;letter-spacing:.06em;color:#f2e2bf}
.abRow .key{font-family:var(--display);font-size:8px;letter-spacing:.1em;color:#e8c78a;border:1px solid rgba(232,184,74,.26);padding:1px 4px}
.abRow .ds{display:block;font-size:11px;color:var(--dim);line-height:1.34;margin-top:1px}

/* right: teams */
.pgTeams{border:1px solid var(--line);background:linear-gradient(180deg,rgba(24,16,10,.78),rgba(11,7,5,.9));padding:11px 11px 12px;display:flex;flex-direction:column;gap:9px;min-width:0}
.teamsHead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.teamsHead .kicker{font-size:9px;letter-spacing:.24em}
.teamsHead .seg button{padding:4px 7px;font-size:9.5px;letter-spacing:.08em}
.tmPanel{border:1px solid rgba(232,184,74,.18);border-top:2px solid var(--tm,#e8b84a);background:rgba(0,0,0,.24)}
.tmPanel.mine{border-color:rgba(232,184,74,.3);border-top-color:var(--tm,#e8b84a);background:rgba(0,0,0,.32)}
.tmPanHead{display:flex;align-items:center;gap:7px;padding:6px 9px;border-bottom:1px solid rgba(232,184,74,.14)}
.tmPanHead .n{font-family:var(--display);font-size:11.5px;letter-spacing:.13em;color:var(--tm,#e8b84a)}
.tmPanHead .tag{font-size:7.5px;letter-spacing:.16em;color:var(--dim)}
.tmPanHead .sc{margin-left:auto;font-family:var(--display);font-size:14px;color:#f2e2bf}
.tmRows{display:flex;flex-direction:column}
.tmRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 9px;border-bottom:1px solid rgba(232,184,74,.07)}
.tmRow:last-child{border-bottom:0}
.tmRow.you{background:linear-gradient(90deg,rgba(232,184,74,.1),transparent)}
.tmWho{display:flex;align-items:center;gap:6px;min-width:0}
.tmWho .em{width:15px;height:15px;flex:none;color:#e8c78a;opacity:.85}
.tmWho .em svg{width:100%;height:100%;display:block}
.tmWho .nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmRow.you .nm{color:#ffe9b4}
.tmWho .nm small{font-weight:500;color:var(--dim);font-size:10px}
.tmWho .cl{font-family:var(--display);font-size:9px;letter-spacing:.05em;color:#e8c78a;white-space:nowrap}
.tmFlag{font-family:var(--display);font-size:7.5px;letter-spacing:.1em;color:var(--dim);border:1px solid rgba(232,184,74,.18);padding:2px 4px;white-space:nowrap}
.tmFlag.bot{opacity:.55}
.tmFlag.ready{color:#a8e6b8;border-color:rgba(168,230,184,.3)}
.pgNote{margin-top:auto;padding-top:10px;border-top:1px solid rgba(232,184,74,.12);font-size:10.5px;line-height:1.4;color:var(--dim);letter-spacing:.01em}

/* ready bar */
.readyBar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 16px;border:1px solid rgba(232,184,74,.26);background:linear-gradient(90deg,rgba(232,184,74,.06),rgba(0,0,0,.3))}
.readyBar.on{border-color:rgba(232,184,74,.6);background:linear-gradient(90deg,rgba(232,184,74,.16),rgba(0,0,0,.28))}
.readyState{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 260px}
.readyState .kicker{font-size:9px;letter-spacing:.24em}
.readyState .line{font-size:12px;color:var(--dim);line-height:1.4}
.readyDots{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.rdot{font-family:var(--display);font-size:7.5px;letter-spacing:.1em;color:var(--dim);border:1px solid rgba(232,184,74,.2);padding:2px 5px}
.rdot.on{color:#a8e6b8;border-color:rgba(168,230,184,.32)}
.readyCount{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:96px}
.readyCount .kicker{font-size:8.5px;letter-spacing:.2em}
.readyCount strong{font-family:var(--display);font-size:26px;letter-spacing:.1em;color:#ffe9b4;line-height:1}
.readyCount strong.hold{font-size:15px;letter-spacing:.16em;color:var(--dim)}
.readyBtns{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.readyBtns .play{padding:11px 30px;font-size:15px;letter-spacing:.18em}

/* game setup */
.setupPage{display:flex;flex-direction:column;gap:14px}
.setupGrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
.setupCol{display:flex;flex-direction:column;gap:16px;min-width:0}
.setGroup{display:flex;flex-direction:column;min-width:0}
.setGroup > h4{margin:0 0 9px;font-size:10.5px;letter-spacing:.26em;color:var(--dim);font-weight:600}
.mapPick{padding:2px 0 0;display:flex;flex-direction:column;gap:2px}
.mapPick h4{margin:0 0 9px;font-size:10.5px;letter-spacing:.26em;color:var(--dim);font-weight:600}
.mapTiles{display:flex;flex-direction:column;gap:7px}
.mapTile{all:unset;cursor:pointer;position:relative;display:grid;grid-template-columns:190px minmax(0,1fr);height:104px;border:1px solid var(--softline);background:rgba(0,0,0,.24);overflow:hidden}
.mapTile .art{position:relative;display:block;overflow:hidden;background:#17100a}
.mapTile .art svg{width:100%;height:100%;display:block}
.mapTile .art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,6,4,0) 52%,rgba(10,6,4,.9))}
.mapTile .cap{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 14px;min-width:0}
.mapTile .nm{font-family:var(--display);font-size:15.5px;letter-spacing:.1em;color:#f2e2bf;line-height:1}
.mapTile .ln{font-size:11.5px;color:#d9c7a8;line-height:1.32;max-width:48ch;margin-top:3px}
.mapTile:hover{border-color:rgba(232,184,74,.5)}
.mapTile.on{border-color:rgba(232,184,74,.8);box-shadow:inset 2px 0 0 var(--hot)}
.mapTile .pick{position:absolute;right:9px;top:9px;z-index:3;font-family:var(--display);font-size:7px;letter-spacing:.18em;color:#ffe9b4;border:1px solid rgba(232,184,74,.5);padding:2px 5px;opacity:0}
.mapTile.on .pick{opacity:1}
.setupOpts{display:flex;flex-direction:column;min-width:0}
.setRows{display:flex;flex-direction:column}
.botCls{display:flex;gap:6px;flex-wrap:wrap;padding:3px 0 5px}
.botClsBtn{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(232,184,74,.2);background:rgba(0,0,0,.22);color:var(--dim)}
.botClsBtn svg{width:22px;height:22px;display:block}
.botClsBtn:hover{border-color:rgba(232,184,74,.45);color:var(--ink)}
.botClsBtn.on{color:#ffe6a8;border-color:rgba(232,184,74,.62);background:rgba(232,184,74,.12)}
.botOffNote{display:block;padding:5px 0 2px;font-size:11px;line-height:1.4;color:var(--dim)}
.tmRow.open .nm{color:var(--dim);font-weight:500}
.tmRow.open .tmFlag{opacity:.55}
.setRow{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid rgba(232,184,74,.12)}
.setRow:last-child{border-bottom:0;padding-bottom:0}
.setRow .k{font-family:var(--display);font-size:9px;letter-spacing:.16em;color:var(--dim)}
.modePick{display:flex;align-items:center;gap:9px;font-family:var(--display);font-size:11.5px;letter-spacing:.08em;color:#f2e2bf}
.linkBtn{all:unset;cursor:pointer;font-family:var(--display);font-size:8px;letter-spacing:.16em;color:#e8c78a;border:1px solid rgba(232,184,74,.28);padding:2px 5px}
.linkBtn:hover{color:#ffe9b4;border-color:rgba(232,184,74,.6)}

/* pre-game match summary */
.sumGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;margin-top:auto;padding-top:9px;border-top:1px solid rgba(232,184,74,.14)}
.sumCell span{display:block;font-family:var(--display);font-size:8px;letter-spacing:.16em;color:var(--dim)}
.sumCell b{display:block;font-family:var(--display);font-size:13px;letter-spacing:.06em;color:#f2e2bf;margin-top:2px}

/* respawn: class and deploy only */
.pgClasses.pulse{animation:classPulse 1.4s ease-out 1}
@keyframes classPulse{
  0%{box-shadow:inset 0 0 0 1px rgba(232,184,74,.9),0 0 26px rgba(232,184,74,.22)}
  100%{box-shadow:inset 0 0 0 1px rgba(232,184,74,0),0 0 0 rgba(232,184,74,0)}
}

/* death screen */
.death{position:relative;min-height:520px;display:grid;place-items:center;padding:36px 20px;border:1px solid var(--line);background:
  radial-gradient(ellipse at 50% 42%,rgba(232,184,74,.1),transparent 64%),
  linear-gradient(180deg,rgba(30,19,11,.92),rgba(9,5,3,.97));overflow:hidden}
.death::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 34%,rgba(4,2,1,.72));pointer-events:none}
.deathCard{position:relative;z-index:1;width:min(560px,100%);display:flex;flex-direction:column;align-items:center;gap:9px;padding:28px 30px 22px;text-align:center;border:1px solid rgba(232,184,74,.32);background:rgba(12,7,4,.7);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.deathCard .kicker{font-size:10px;letter-spacing:.34em;color:#e8c78a}
.deathCard h2{font-size:clamp(26px,3.1vw,38px);letter-spacing:.09em;color:#f7ead0;line-height:1.05}
.dline{margin:0;font-size:13px;line-height:1.5;color:var(--dim);max-width:40ch}
.dbtns{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;width:100%;margin-top:9px}
.dbtns .play{padding:13px 28px;font-size:15px;letter-spacing:.18em}
.dwave{font-family:var(--display);font-size:9.5px;letter-spacing:.22em;color:var(--dim);margin-top:3px}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:80;background:rgba(24,16,10,.97);border:1px solid rgba(232,184,74,.6);border-left:3px solid var(--hot);padding:10px 16px;font-family:var(--display);font-size:12px;letter-spacing:.1em;color:#ffe9b4;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (min-width:981px){
  .pgClasses .clsPick{flex:1 1 auto}
}
@media (max-width:1080px){
  .pgGrid{grid-template-columns:196px minmax(0,1fr) 246px}
  .pgHero{grid-template-columns:150px minmax(0,1fr)}
  .pgPortrait{width:150px;height:196px}
}
@media (max-width:980px){
  .mkbar .note{display:none}
  .railLayout{grid-template-columns:1fr}
  .rail{flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:11px 12px;gap:8px;overflow-x:auto;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .railBrand{display:none}
  .railNav{flex-direction:row;gap:2px}
  .railBtn{border-left:0;border-bottom:2px solid transparent;white-space:nowrap;padding:9px 11px}
  .railBtn.on{border-left:0;border-bottom-color:var(--hot);background:none}
  .railFoot{display:none}
  .cols2,.pgTop{grid-template-columns:1fr}
  .playSplit{grid-template-columns:1fr}
  .setupGrid{grid-template-columns:1fr}
  .chaliceArt{min-height:320px}
  .pgGrid{grid-template-columns:minmax(0,1fr) 246px;grid-template-areas:"mid teams" "cls teams"}
  .pgMid{grid-area:mid}
  .pgClasses{grid-area:cls;flex-direction:row;flex-wrap:wrap}
  .pgClasses > .kicker{display:none}
  .pgClasses > .pgNote{display:none}
  .clsPick{flex:1 1 130px;padding:7px 6px;grid-template-columns:24px minmax(0,1fr) auto;gap:7px}
  .clsPick .key{display:none}
  .pgTeams{grid-area:teams}
}
@media (max-width:760px){
  .pgGrid{grid-template-columns:1fr;grid-template-areas:"mid" "cls" "teams"}
  .pgHero{grid-template-columns:132px minmax(0,1fr)}
  .pgPortrait{width:132px;height:172px}
  .pgClasses{flex-direction:column}
  .clsPick{flex:none}
}
@media (max-width:640px){
  .mkbar{gap:10px}
  .mkbar .tag{display:none}
  .mkbar .phase{padding-left:0;border-left:0}
  .stage{padding:14px 10px 40px}
  .rail{flex-wrap:wrap;overflow:visible}
  .railNav{flex-wrap:wrap}
  .railMain{padding:18px 14px}
  .rules{font-size:12px}
  .panelhead .side{text-align:left}
  .play{width:100%;text-align:center;clip-path:none;padding:15px 26px}
  .ctaRight,.ctaRight .play{width:100%}
  .ctaRight{flex-direction:column;align-items:stretch}
  .pgMid,.pgTeams,.pgClasses{padding:11px}
  .pgHero{grid-template-columns:112px minmax(0,1fr);gap:11px}
  .pgPortrait{width:112px;height:146px}
  .pgHeroText h2{font-size:23px}
  .pgHeroText .line{font-size:12px}
  .readyBar{gap:10px}
  .readyCount{align-items:flex-start}
  .readyBtns{width:100%;margin-left:0}
  .readyBtns .play{flex:1 1 100%}
  .mapCap{min-height:130px}
  .mapShot{min-height:130px}
  .chaliceArt{min-height:250px}
  .mapTile{height:92px;grid-template-columns:150px minmax(0,1fr)}
  .cup{width:min(200px,58%)}
  .death{min-height:420px;padding:26px 14px}
  .deathCard{padding:22px 18px 18px}
  .dbtns{flex-direction:column;align-items:stretch}
  .dbtns .small{width:100%}
}

const OPTIONS = {
  A: { label:'A · MENU', note:'The menu is now three mode cards and a Game Setup button. The setup screen comes next.' },
  G: { label:'G · SETUP', note:'Game setup picks the map and the match rules. The lobby comes after it and only shows what was set.' },
  S: { label:'S · PRE-GAME', note:'Kick-off picks class, team and name with the map in front of you. The death screen leads to a lean respawn screen with just class and deploy.' }
};

const S = {
  opt:'A', nav:'local', mode:'chalice', cls:'knight', map:'basilica', firstTo:'30', len:'10',
  botsOn:true, dupes:false, customCls:false, botCls:['knight','sorcerer','goblin','lampist','brigand'],
  bots:'normal', size:4, team:'thistle', name:'Alex', sens:'1.00', pass:'off',
  phase:'kick', ready:false, mateReady:false, count:5, deployed:false, focusClass:false
};

{
  const q = new URLSearchParams(location.search);
  if(OPTIONS[q.get('opt')]) S.opt = q.get('opt');
  if(['local','online','tutorial','settings','editor'].includes(q.get('nav'))) S.nav = q.get('nav');
  if(MODES[q.get('mode')]) S.mode = q.get('mode');
  if(MAPS.some(m => m.key === q.get('map'))) S.map = q.get('map');
  if(['thistle','marigold'].includes(q.get('team'))) S.team = q.get('team');
  if(+q.get('size') >= 1 && +q.get('size') <= 6) S.size = +q.get('size');
  if(q.get('phase') === 'respawn') S.phase = 'respawn';
  if(['20','25','30','40'].includes(q.get('firstTo'))) S.firstTo = q.get('firstTo');
  if(['5','10','15'].includes(q.get('len'))) S.len = q.get('len');
  if(q.get('bots') === 'off') S.botsOn = false;
  if(q.get('dupes') === 'on') S.dupes = true;
  if(q.get('custom') === 'on') S.customCls = true;
  if(q.get('phase') === 'dead') S.phase = 'dead';
  if(location.hash === '#dead') S.phase = 'dead';
  if(location.hash === '#respawn') S.phase = 'respawn';
}

const MATES = [
  { name:'Mara', cls:'sorcerer', human:true },
  { name:'Ivo', cls:'lampist', human:false },
  { name:'Bex', cls:'brigand', human:false },

const clsOf = () => CLASSES.find(c => c.key === S.cls);
const clsByKey = k => CLASSES.find(c => c.key === k);
const mapOf = () => MAPS.find(m => m.key === S.map);
const modeOf = () => MODES[S.mode];
const botName = () => S.bots[0].toUpperCase() + S.bots.slice(1);
const teamName = k => (k || S.team) === 'thistle' ? 'Thistle' : 'Marigold';

const activeMates = () => {
  const list = MATES.slice(0, Math.max(0, S.size - 1)).map(m => m.human ? m : { ...m, cls: botClass(m.cls) });

};

const LOCK_IC = '<svg viewBox="0 0 12 14" fill="currentColor" fill-rule="evenodd"><path d="M6 .8C4 .8 2.6 2.3 2.6 4.2v1.6H2.2C1.4 5.8.8 6.4.8 7.2v4.6c0 .8.6 1.4 1.4 1.4h7.6c.8 0 1.4-.6 1.4-1.4V7.2c0-.8-.6-1.4-1.4-1.4H9.4V4.2C9.4 2.3 8 .8 6 .8Zm0 1.7c1 0 1.7.8 1.7 1.7v1.6H4.3V4.2c0-.9.7-1.7 1.7-1.7Z"/><path d="M6 8.2a1.4 1.4 0 1 1 0 2.8 1.4 1.4 0 1 1 0-2.8Z"/><path d="M5.4 10.3h1.2v1.7H5.4z"/></svg>';

function classPickRow(c){
  const n = countOf(c.key);
  return `<button type="button" class="clsPick ${c.key === S.cls ? 'on' : ''}" data-act="cls" data-v="${c.key}" aria-pressed="${c.key === S.cls}">

      <span class="rl">${c.role}</span>

    ${n ? (S.dupes ? `<span class="ct">×${n}</span>` : `<span class="ct lock">${LOCK_IC}${n > 1 ? n : ''}</span>`) : '<span class="ct open">OPEN</span>'}

}
function loadoutRows(c){
  return c.loadout.map(([k, name, d]) => `<div class="loRow"><span class="k">${k}</span><span class="t"><b>${name}</b>${d}</span></div>`).join('');
}
function abilityRows(c){
  return c.abil.map(([kind, name, key, desc], i) => `
    <div class="abRow">
      <span class="ic">${ABIC[c.key][i] || ''}</span>
      <span>
        <span class="hd"><span class="kind">${kind}</span><span class="nm">${name}</span><span class="key">${key}</span></span>
        <span class="ds">${desc}</span>
      </span>
    </div>`).join('');
}
function teamRow(f){
  const c = clsByKey(f.cls);
  const flag = f.you ? (S.phase === 'kick' ? (S.ready ? 'READY' : 'WAITING') : 'YOU')
    : f.human ? (S.phase === 'kick' ? (S.mateReady ? 'READY' : 'WAITING') : 'HUMAN')
    : 'BOT';
  const ready = flag === 'READY';
  return `<div class="tmRow ${f.you ? 'you' : ''}">
    <span class="tmWho">
      <span class="em">${c ? SYM[c.key] : ''}</span>
      <span class="nm">${f.name}</span>
      <span class="cl">${c ? c.name : ''}</span>
    </span>
    <span class="tmFlag ${ready ? 'ready' : ''} ${flag === 'BOT' ? 'bot' : ''}">${flag}</span>
  </div>`;
}
function enemyRow(name, cls){
  const c = clsByKey(cls);
  return `<div class="tmRow">
    <span class="tmWho">
      <span class="em">${SYM[c.key]}</span>
      <span class="nm">${name}</span>
      <span class="cl">${c.name}</span>
    </span>
    <span class="tmFlag bot">BOT</span>
  </div>`;
}
function openRow(){
  return `<div class="tmRow open">
    <span class="tmWho"><span class="nm">OPEN</span></span>
    <span class="tmFlag">SLOT</span>
  </div>`;
}
function teamPanel(mine){
  const key = mine ? S.team : otherTeam();
  let rows = '';
  const mates = activeMates();
  if(mine){
    rows += teamRow({ name:S.name, cls:S.cls, you:true });
    mates.forEach(m => { rows += teamRow({ name:m.name, cls:m.cls, human:m.human }); });
    for(let i = 1 + mates.length; i < S.size; i++) rows += openRow();
  } else if(S.botsOn){
    ENEMIES.slice(0, S.size).forEach(([n, k]) => { rows += enemyRow(n, botClass(k)); });
  } else {
    for(let i = 0; i < S.size; i++) rows += openRow();
  }
  return `<div class="tmPanel ${mine ? 'mine' : ''}" style="--tm:${teamColor(key)}">
    <div class="tmPanHead">
      <span class="n">${teamName(key).toUpperCase()}</span>
      <span class="tag">${mine ? 'YOUR TEAM' : 'ENEMY'}</span>
      <span class="sc">${S.phase === 'kick' ? 0 : mine ? 12 : 9}</span>
    </div>
    <div class="tmRows">${rows}</div>
  </div>`;
}

          ${teamPanel(true)}
          ${teamPanel(false)}
          ${kick ? `<span class="pgNote">${S.botsOn ? 'Bots are always ready. Open slots fill at kick-off.' : 'Bots are off. Open slots wait for players.'}</span>` : ''}
        </div>
      </div>

      ${readyBar()}
    </div>`;
}

function mapTile(m){
  const on = S.map === m.key;
  return `<button type="button" class="mapTile ${on ? 'on' : ''}" data-act="map" data-v="${m.key}" aria-pressed="${on}">
    <span class="art">${ART[m.key]}</span>
    <span class="pick">PICKED</span>
    <span class="cap">
      <span class="nm">${m.name}</span>
      <span class="ln">${m.line}</span>
    </span>
  </button>`;
}
function botClassRow(){
  return `<div class="botCls">${CLASSES.map(c => `<button type="button" class="botClsBtn ${S.botCls.includes(c.key) ? 'on' : ''}" data-act="botcls" data-v="${c.key}" aria-pressed="${S.botCls.includes(c.key)}" aria-label="${c.name}" title="${c.name}">${SYM[c.key]}</button>`).join('')}</div>`;
}
function renderG(){
  const m = mapOf();
  $('#optG').innerHTML = `
    <div class="setupPage">
      <div class="panelhead">
        <div><span class="kicker">GAME SETUP</span><h2>Match Settings</h2></div>
      </div>
      <div class="setupGrid">
        <div class="mapPick">
          <h4>MAP</h4>
          <div class="mapTiles">${MAPS.map(mapTile).join('')}</div>
        </div>
        <div class="setupCol">
          <div class="setGroup">
            <h4>MATCH</h4>
            <div class="box setupOpts">
            <div class="setRows">
              <div class="setRow"><span class="k">MODE</span><span class="modePick">${modeOf().name}<button type="button" class="linkBtn" data-act="backLocal">CHANGE</button></span></div>
              <div class="setRow"><span class="k">FIRST TO</span>${seg('firstTo',[['20','20'],['25','25'],['30','30'],['40','40']],S.firstTo)}</div>
              <div class="setRow"><span class="k">GAME LENGTH</span>${seg('len',[['5','5 min'],['10','10 min'],['15','15 min']],S.len)}</div>
            </div>
            </div>
          </div>
          <div class="setGroup">
            <h4>BOTS</h4>
            <div class="box setupOpts">
            <div class="setRows">
              <div class="setRow"><span class="k">ENABLED</span>${seg('botsOn',[['on','On'],['off','Off']], S.botsOn ? 'on' : 'off')}</div>
              ${S.botsOn ? `
                <div class="setRow"><span class="k">TEAM SIZE</span>${seg('size',[[1,'1v1'],[2,'2v2'],[3,'3v3'],[4,'4v4'],[5,'5v5'],[6,'6v6']],S.size)}</div>
                <div class="setRow"><span class="k">ALLOW DUPLICATES</span>${seg('dupes',[['off','Off'],['on','On']], S.dupes ? 'on' : 'off')}</div>
                <div class="setRow"><span class="k">CUSTOM CLASSES</span>${seg('customCls',[['off','Off'],['on','On']], S.customCls ? 'on' : 'off')}</div>
                ${S.customCls ? botClassRow() : ''}
              ` : '<span class="botOffNote">No bots. Open slots wait for players.</span>'}
            </div>
            </div>
          </div>
        </div>
      </div>
      <div class="ctaBar">
        <div class="ctaSum"><span class="line1">${m.name} · ${modeOf().name}</span>${S.size}v${S.size} · first to ${S.firstTo} · ${S.len} minute match</div>
        <div class="ctaRight">
          <button type="button" class="small" data-act="backLocal">BACK</button>
          ${playBtn('ENTER LOBBY','lobby')}
        </div>
      </div>
    </div>`;
}

function renderChrome(){
  $('#optBar').innerHTML = Object.entries(OPTIONS).map(([k, o]) =>
    `<button type="button" data-act="opt" data-v="${k}" class="${S.opt === k ? 'on' : ''}" aria-pressed="${S.opt === k}">${o.label}</button>`
  ).join('');
  $('#optNote').innerHTML = `<span>OPTION ${S.opt}</span>${OPTIONS[S.opt].note}`;
  $('#app').dataset.team = S.team;
  $('#optA').hidden = S.opt !== 'A';
  $('#optG').hidden = S.opt !== 'G';
  $('#optS').hidden = S.opt !== 'S';
  const ph = $('#phaseBar');
  ph.hidden = S.opt !== 'S';
  ph.innerHTML = [['kick','KICK-OFF'],['dead','DEATH'],['respawn','RESPAWN']].map(([k, label]) =>
    `<button type="button" data-act="phase" data-v="${k}" class="${S.phase === k ? 'on' : ''}" aria-pressed="${S.phase === k}">${label}</button>`
  ).join('');
}

function render(){
  renderChrome();
  renderA(); renderG(); renderS();
}

let toastTimer = 0;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2300);
}

let countdown = 0;
function startCountdown(){
  clearInterval(countdown);
  countdown = setInterval(() => {
    S.count--;
    if(S.count <= 0){ clearInterval(countdown); S.count = 0; S.deployed = true; render(); toast('Countdown done. The match would start.'); return; }
    render();
  }, 1000);
}
function resetReady(){
  S.ready = false; S.mateReady = false; S.count = 5; S.deployed = false;
  clearInterval(countdown);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if(act === 'opt'){ S.opt = v; if(v === 'S' && S.phase === 'kick') resetReady(); render(); }
  else if(act === 'phase'){ S.phase = v; resetReady(); render(); }
  else if(act === 'nav'){ S.nav = v; S.opt = 'A'; render(); }
  else if(act === 'mode'){ S.mode = v; render(); }
  else if(act === 'cls'){ S.cls = v; render(); }
  else if(act === 'bots'){ S.bots = v; render(); }
  else if(act === 'map'){ S.map = v; render(); }
  else if(act === 'size'){ S.size = +v; resetReady(); render(); }
  else if(act === 'team'){ S.team = v; render(); }
  else if(act === 'pass'){ S.pass = v; render(); }
  else if(act === 'readyopt'){ toast('Ready-up would be a switch in the real settings.'); }
  else if(act === 'setup'){ S.opt = 'G'; render(); }
  else if(act === 'lobby'){ S.opt = 'S'; S.phase = 'kick'; resetReady(); render(); }
  else if(act === 'backLocal'){ S.nav = 'local'; S.opt = 'A'; render(); }
  else if(act === 'firstTo'){ S.firstTo = v; render(); }
  else if(act === 'botsOn'){ S.botsOn = v === 'on'; render(); }
  else if(act === 'dupes'){ S.dupes = v === 'on'; render(); }
  else if(act === 'customCls'){ S.customCls = v === 'on'; render(); }
  else if(act === 'botcls'){
    const i = S.botCls.indexOf(v);
    if(i >= 0){ if(S.botCls.length > 1) S.botCls.splice(i, 1); }
    else S.botCls.push(v);
    render();
  }
  else if(act === 'len'){ S.len = v; render(); }
  else if(act === 'play'){ S.opt = 'S'; S.phase = 'kick'; resetReady(); render(); }
  else if(act === 'ready'){
    S.ready = true; render();
    setTimeout(() => { S.mateReady = true; render(); if(allReady()) startCountdown(); }, 900);
  }
  else if(act === 'respawn' || act === 'changeclass'){
    S.phase = 'respawn';
    S.focusClass = act === 'changeclass';
    render();
    if(S.focusClass) setTimeout(() => { S.focusClass = false; }, 1600);
  }
  else if(act === 'deploy'){
    if(S.phase === 'respawn' || S.deployed) toast('Deploying as ' + clsOf().name + '.');
    else toast('The match starts when the countdown ends.');
  }
  else if(act === 'tutorialMatch'){ toast('A tutorial match would start here.'); }
  else if(act === 'online'){ toast(v || 'Online and LAN are not built yet.'); }
  else if(act === 'editor'){ toast('The map editor would open from here.'); }
  else if(act === 'tune'){ toast('The full tuning menu would open here.'); }
  else if(act === 'reset'){ toast('This would reset the tuning values.'); }
  else if(act === 'toast'){ toast(v); }
});

document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.act === 'sens'){
    S.sens = el.value;
    const out = document.getElementById('sensV');
    if(out) out.textContent = (+el.value).toFixed(2);
  }
  if(el.dataset.act === 'name') S.name = el.value;
});

render();
})();
</script>
